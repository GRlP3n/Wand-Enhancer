name: Build executable

on:
  workflow_dispatch:
  push:
    branches: ['fix/wand-trainer-318']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Glitxhhh/WandMagica
          ref: 91c831b9d004a26c81411d25eb5eb56dfca32bdb
      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml
      - name: Build and test offline executable
        shell: pwsh
        run: ./build.ps1 -Configuration Release
      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-PR318-91c831b
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
